[tool.poetry]
name = "heart-disease-prediction"
version = "1.0.0"
description = "Heart disease risk prediction — refactored Task 1"
authors = ["Xuanlin Li"]
readme = "README.md"
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
pandas = "^2.0"
numpy = "^1.24"
scikit-learn = "^1.3"
pyyaml = "^6.0"
joblib = "^1.3"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4"
ruff = "^0.5"
black = "^24.4"
pre-commit = "^3.7"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
ignore = ["E501", "N803", "N806"]

[tool.black]
line-length = 100
target-version = ["py310"]
